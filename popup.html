<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { --accent:#3a7bc0; --accent-hover:#4a8fd4; --success:#2e7d32; --success-hover:#388e3c; --border:#e0e0e0; --bg:#fff; --fg:#222; --hint:#555; --muted:#6b6b6b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1e1e1e; --fg:#e8e8e8; --hint:#aaa; --muted:#999; --border:#444; }
      body { background: var(--bg); color: var(--fg); }
      .h-item { background:#2a2a2a !important; border-color:#444 !important; }
      .h-item:hover { background:#2f3a4f !important; border-color:#5a7fbf !important; }
      #history { scrollbar-color:#555 transparent; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
    body { width: 300px; min-width:300px; font-family: system-ui, sans-serif; padding: 12px; margin: 0; background:var(--bg); color:var(--fg); }
    h1 { font-size: 15px; margin: 0 0 10px; }
    button { font-family: inherit; }
    .btn-primary { width:100%; margin-bottom:8px; padding:8px; border:none; border-radius:6px; color:#fff; font-weight:600; cursor:pointer; font-size:13px; background:var(--accent); }
    .btn-primary:hover { background:var(--accent-hover); }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .btn-primary:focus-visible, .btn-secondary:focus-visible, #options-link:focus-visible, #history-toggle:focus-visible, #clear-history:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .btn-secondary { width:100%; margin-bottom:8px; padding:7px 8px; border:1.5px solid var(--accent); border-radius:6px; color:var(--accent); font-weight:600; cursor:pointer; font-size:13px; background:transparent; }
    .btn-secondary:hover { background: rgba(58,123,192,.08); }
    .btn-secondary:disabled { opacity:.5; cursor:not-allowed; }
    #status { font-size: 12px; color: var(--hint); min-height: 16px; margin-bottom: 6px; }
    #footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); }
    #options-link { color: var(--accent); cursor: pointer; text-decoration: underline; background:none; border:none; font-size:11px; padding:2px 4px; }
    #history-toggle { font-size: 11px; color: var(--accent); cursor: pointer; user-select: none; margin: 6px 0 4px; background:none; border:none; padding:2px 4px; font-family:inherit; }
    #history { max-height: 220px; overflow-y: auto; display: none; }
    #history.open { display: block; }
    .h-item { display:block; width:100%; text-align:left; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; cursor: pointer; background: #fafafa; font-family:inherit; }
    .h-item:hover { background: #eef4ff; border-color: #b9d1f5; }
    .h-item:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
    .h-meta { font-size: 11px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .h-preview { font-size: 11px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    @media (prefers-color-scheme: dark) { .h-meta{color:#aaa;} .h-preview{color:#ddd;} #clear-history{color:#ff8a80;} }
    .h-empty, .h-actions { font-size: 11px; color: var(--muted); }
    .h-actions { display: flex; justify-content: flex-end; margin-top: 4px; }
    #clear-history { font-size: 11px; color: #ef5350; cursor: pointer; background: none; border: none; padding: 2px 6px; width: auto; font-weight: 400; }
    .hint { font-size: 11px; color: var(--hint); }
  </style>
</head>
<body>
  <h1>TagExtract</h1>
  <button id="copy-tags" class="btn-primary" type="button">Copy Tags</button>
  <button id="copy-all" class="btn-secondary" type="button">Copy All: tags + metadata</button>
  <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="footer">
    <span id="format-label"></span>
    <button id="options-link" type="button">Options</button>
  </div>
  <button id="history-toggle" type="button" aria-expanded="false" aria-controls="history">▸ History (0)</button>
  <div id="history" role="region" aria-label="Copy history"></div>
  <div class="hint">Shortcuts: Ctrl+Shift+1 (Copy Tags) / Ctrl+Shift+2 (Copy All)</div>
  <script src="popup.js"></script>
</body>
</html>
